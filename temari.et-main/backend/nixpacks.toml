# Nixpacks configuration for Coolify deployment.
#
# Builds the Laravel API and runs, under supervisor, in one container:
#   - nginx (public entrypoint, $PORT)
#   - php-fpm
#   - queue workers (database queue)   -> worker-laravel.conf
#   - the scheduler (schedule:work)    -> worker-scheduler.conf
#   - Reverb websockets (chat)         -> worker-reverb.conf (nginx proxies
#     /app + /apps to it, so wss:// rides the same domain + TLS)
#
# Required Coolify env vars: APP_KEY, APP_ENV=production, APP_DEBUG=false,
# APP_URL, FRONTEND_URL, DB_*, plus R2 / SMS / Cloudflare PDF credentials
# (see .env.example). Health check path: /up

[variables]
NIXPACKS_PHP_ROOT_DIR = '/app/public'
NIXPACKS_PHP_FALLBACK_PATH = '/index.php'
# Vite 8 needs Node >= 20.19; nixpacks defaults to 18.
# NOTE: asset build must use npm (package-lock.json) — a pnpm lockfile makes
# nixpacks install pnpm via nix, which collides with composer (LICENSE file).
NIXPACKS_NODE_VERSION = '22'

[phases.setup]
nixPkgs = ['...', 'python311Packages.supervisor']

[phases.build]
cmds = [
    '...',
    'composer install --no-dev --optimize-autoloader --no-interaction',
    'mkdir -p /etc/supervisor/conf.d/ /var/log/nginx /var/cache/nginx',
    'cp /assets/worker-*.conf /etc/supervisor/conf.d/',
    'cp /assets/supervisord.conf /etc/supervisord.conf',
    'chmod +x /assets/start.sh',
    'chmod -R ug+rwX storage bootstrap/cache',
]

[start]
cmd = '/assets/start.sh'

[staticAssets]
"start.sh" = '''
#!/usr/bin/env bash
set -e

# Render the nginx config template ($PORT, nix store paths)
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Laravel boot tasks — run once per deploy, before serving traffic
php /app/artisan storage:link || true
php /app/artisan config:cache
php /app/artisan route:cache
php /app/artisan view:cache
php /app/artisan event:cache
php /app/artisan migrate --force
# Role → permission catalog is code-owned (RolePermissionSeeder syncs it).
# --force is REQUIRED: APP_ENV=production makes db:seed prompt, and with no TTY
# the prompt resolves to "no" → exit 1 → `set -e` kills the container at boot.
php /app/artisan db:seed --class=RolePermissionSeeder --force

# Hand over to supervisor (nginx + php-fpm + queue workers + scheduler)
exec supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F -d memory_limit=512M -d upload_max_filesize=64M -d post_max_size=64M
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
startsecs=0
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-reverb.conf" = '''
[program:worker-reverb]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan reverb:start --host=127.0.0.1 --port=8080'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-scheduler.conf" = '''
[program:worker-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan schedule:work'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"nginx.template.conf" = '''
user root;
worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include $!{nginx}/conf/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 64M;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        root /app/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Reverb websockets: /app/{key} is the WS handshake, /apps/{id}/* the
        # publish API — both ride the public domain so wss:// shares the TLS
        # Traefik terminates.
        location ~ ^/apps? {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            fastcgi_read_timeout 120;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
